# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm (0,70 -> 0,75).
#   b) Theo nhân viên, m = 75: DE = 1 + 74 x 0,02 = 2,48; 1.251 x 2,48 = 3.103 mỗi nhóm -> 42 nhân viên mỗi nhóm, tổng 84 > 40: không đủ người.
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng tối đa 20 / 0,02 = 1.000 < 1.251: không đạt câu a.
#   d) 6 depot mỗi nhóm: cỡ mẫu hiệu dụng tối đa 6 / 0,02 = 300 < 1.251: không đạt.
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: m >= 299 yêu cầu mỗi nhân viên (DE 6,96; hiệu dụng 859,2).
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: có, 20 nhân viên đối chứng làm cùng tuần, cùng 6 depot với nhóm dùng trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: ngẫu nhiên theo staff_id bằng code có seed ghi trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: nhân viên cùng depot có thể chia sẻ cách dùng; giới hạn quyền trợ lý theo tài khoản staff_id và ghi log lượt mở.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: có, dong_trong_24h_khong_mo_lai_7_ngay, mức chênh 6 điểm, quyết định ngày 2027-01-05.
#   5. Ít nhất 20 cụm mỗi nhóm: có, đúng 20 nhân viên (cụm) mỗi nhóm.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện): không đủ người để thấy mức 5 điểm, nên chỉ phát hiện được mức chênh 6 điểm; nếu tác động thật là 5 điểm thì power chỉ 0,64. Giám đốc vận hành ký chấp nhận trước khi chạy.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn: 4,25% (51/1.200), phạm vi pilot 3,97% (39/982); ngưỡng dừng là cao hơn đối chứng từ 2 điểm hoặc vượt 6%, nên mức hiện tại không làm pilot dừng ngay tuần đầu.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"                      # một người có tên vai trò, không ghi "cả đội"
  scope: "Chỉ triển khai với yêu cầu noi_dia và hang_nang tại 6 depot được chọn. CPS lần lượt là 2.696đ (0.22x) và 8.221đ (0.69x) so với baseline 12.000đ [simulated]. Loại quoc_te (22.515đ, 1.88x) và doi_tac (10.215đ, 0.85x) khỏi phạm vi pilot."                      # loại yêu cầu nào, depot nào; dựa vào kết quả A3
  assignment:
    unit: "staff"                     # request | staff | depot
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96            # 1 nếu chia theo yêu cầu
    clusters_per_arm: 20         # để trống nếu chia theo yêu cầu
  identifiability:
    concurrent_control: "Có. Nhóm đối chứng gồm 20 nhân viên làm việc cùng thời gian, cùng tuần và cùng 6 depot với nhóm trợ lý."
    spillover_risk: "Có nguy cơ nhân viên trong cùng depot chia sẻ câu trả lời hoặc cách sử dụng trợ lý. Giảm thiểu bằng quyền truy cập theo tài khoản, giới hạn quyền sử dụng theo staff_id và ghi log lượt mở trợ lý."
    predeclared: "Chốt trước khi bắt đầu pilot: chỉ số chính dong_trong_24h_khong_mo_lai_7_ngay, baseline 0.70, mục tiêu chênh 6 điểm phần trăm, alpha 0.05, power 0.80, ba luật dừng an toàn và ngày quyết định 2027-01-05."
  stop_rules:
    - "NẾU tỷ lệ mở lại trong 7 ngày của nhóm trợ lý cao hơn nhóm đối chứng từ 2 điểm phần trăm trở lên hoặc vượt 6%, hoặc xuất hiện ít nhất 1 ca hoàn trùng TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút KHÔNG THÌ không được chuyển sang bước rollout tiếp theo."
    - "NẾU chi phí mỗi việc thành công lớn hơn 8.000đ TRONG 2 tuần liên tiếp THÌ PM thu hẹp phạm vi về noi_dia và giới hạn tối đa 2 lần chạy KHÔNG THÌ không được mở rộng sang hang_nang."
    - "NẾU tỷ lệ bỏ qua gợi ý (sua + bo) lớn hơn 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày KHÔNG THÌ không được chuyển sang bước rollout tiếp theo."
  interim_looks: "Chỉ kiểm tra các chỉ số an toàn trong quá trình pilot; không kiểm định sớm chỉ số hiệu quả chính để tránh ảnh hưởng đến quyết định thống kê cuối cùng."
  rollback: "Giám đốc vận hành LogiX-VN có quyền bấm cờ tắt trợ lý. Việc tắt có hiệu lực trong vòng 30 phút. Sau rollback, toàn bộ yêu cầu hoàn phí được chuyển về quy trình nhân viên tự xử lý, đảm bảo khách hàng vẫn được phục vụ."
  decision_date: "2027-01-05"
  simulated_inputs:
    - "Toàn bộ dữ liệu logix_requests.csv và logix_runs.csv là dữ liệu giả lập."
    - "CPS noi_dia: 2.696đ/việc thành công."
    - "CPS hang_nang: 8.221đ/việc thành công."
    - "CPS quoc_te: 22.515đ/việc thành công."
    - "CPS doi_tac: 10.215đ/việc thành công."
    - "Tỷ lệ mở lại 7 ngày toàn bộ: 4.25% (51/1200)."
    - "Tỷ lệ mở lại 7 ngày trong phạm vi noi_dia và hang_nang: 3.97% (39/982)."
    - "Baseline chỉ số chính: 0.70; mục tiêu thiết kế ban đầu: tăng 5 điểm phần trăm."
    - "Mức chênh 6 điểm phần trăm được chọn để phù hợp giới hạn 20 nhân viên mỗi nhóm."
    - "ICC: 0.02; 20 nhân viên mỗi nhóm; tối thiểu 299 yêu cầu mỗi nhân viên."
    - "Design effect: 6.96; cỡ mẫu hiệu dụng: 859 mỗi nhóm."
    - "Power nếu tác động thực tế chỉ tăng 5 điểm phần trăm: 0.64."
    - "Ngưỡng an toàn mở lại: cao hơn đối chứng 2 điểm phần trăm hoặc vượt trần tuyệt đối 6%."
    - "Ngưỡng chi phí: 8.000đ/việc thành công."
    - "Ngưỡng bỏ qua gợi ý: 40%."
